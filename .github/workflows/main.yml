name: CI
on:
  push:
    branches:
      - main
  pull_request:
# [TEST] Hyoid verifier demo: least privilege for the whole workflow.
permissions:
  contents: read
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
  # [TEST] Hyoid verifier demo: fails while lodash < 4.17.21 (CVE-2021-23337) is present.
  lodash-regression:
    name: lodash-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # [TEST] Self-test fixtures must pass before the real check runs.
      - run: node .github/scripts/lodash-regression.selftest.mjs
      # [TEST] Install exactly the committed lockfile, no install scripts. A missing lockfile is reported by the check.
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else echo "[TEST] no package-lock.json committed"; fi
      - run: node .github/scripts/lodash-regression.mjs
